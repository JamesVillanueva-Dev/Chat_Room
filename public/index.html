<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Room</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="chat-container">
    <div class="header">
      <div>
        <h1>Chat Room</h1>
        <p>Open this page from multiple devices or browser tabs on your local network.</p>
      </div>
      <div>
        <label>
          Name
          <input id="username" class="username" type="text" placeholder="Your name" maxlength="20" />
        </label>
      </div>
    </div>

    <div id="messages" class="messages"></div>

    <form id="chat-form" class="form">
      <input id="message-input" type="text" autocomplete="off" placeholder="Type a message..." required />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const messages = document.getElementById('messages');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const usernameInput = document.getElementById('username');

    const appendMessage = (data) => {
      const item = document.createElement('div');
      item.className = 'message';
      item.innerHTML = `<strong>${data.username}</strong> <small>${data.time}</small><div>${data.text}</div>`;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    };

    chatForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;
      socket.emit('chat message', {
        username: usernameInput.value.trim() || 'Guest',
        text,
      });
      messageInput.value = '';
      messageInput.focus();
    });

    socket.on('chat message', (message) => {
      appendMessage(message);
    });
  </script>
</body>
</html>
