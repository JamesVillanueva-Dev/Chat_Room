<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A self-hosted chat room with rooms, direct messages, threads and a bot." />
    <meta name="color-scheme" content="light dark" />
    <title>Chat Room</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#composer-input">Skip to the message box</a>

    <div id="app" class="app-root">
      <div class="boot-screen">
        <span class="boot-logo" aria-hidden="true">💬</span>
        <p>Loading Chat Room…</p>
      </div>
    </div>

    <noscript>
      <p class="noscript">Chat Room needs JavaScript enabled to run.</p>
    </noscript>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
