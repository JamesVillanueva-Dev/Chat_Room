<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Room</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f2f2f2; }
    .chat-container { max-width: 900px; margin: 0 auto; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .messages { min-height: 60vh; background: white; padding: 16px; border-radius: 8px; overflow-y: auto; box-shadow: 0 0 10px rgba(0,0,0,.05); }
    .message { margin-bottom: 12px; }
    .message strong { color: #333; }
    .message small { color: #666; margin-left: 8px; }
    .form { display: flex; gap: 8px; margin-top: 12px; }
    .form input[type="text"] { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; }
    .form button { padding: 10px 18px; border: none; border-radius: 6px; background: #007bff; color: white; cursor: pointer; }
    .form button:hover { background: #0062cc; }
    .username { width: 180px; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      <div>
        <h1>Chat Room</h1>
        <p>Open this page from multiple devices or browser tabs on your local network.</p>
      </div>
      <div>
        <label>
          Name
          <input id="username" class="username" type="text" placeholder="Your name" maxlength="20" />
        </label>
      </div>
    </div>

    <div id="messages" class="messages"></div>

    <form id="chat-form" class="form">
      <input id="message-input" type="text" autocomplete="off" placeholder="Type a message..." required />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const messages = document.getElementById('messages');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const usernameInput = document.getElementById('username');

    const appendMessage = (data) => {
      const item = document.createElement('div');
      item.className = 'message';
      item.innerHTML = `<strong>${data.username}</strong> <small>${data.time}</small><div>${data.text}</div>`;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    };

    chatForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;
      socket.emit('chat message', {
        username: usernameInput.value.trim() || 'Guest',
        text,
      });
      messageInput.value = '';
      messageInput.focus();
    });

    socket.on('chat message', (message) => {
      appendMessage(message);
    });
  </script>
</body>
</html>
