<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A self-hosted chat room with rooms, direct messages, threads and a bot." />
    <meta name="color-scheme" content="light dark" />
    <title>Chat Room</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#composer-input">Skip to the message box</a>

    <div id="app" class="app-root">
      <div class="boot-screen">
        <svg
          class="boot-logo icon"
          viewBox="0 0 24 24"
          width="40"
          height="40"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 11.5a8.5 8.5 0 0 1-11.9 7.8L3.5 21l1.7-5.1A8.5 8.5 0 1 1 21 11.5Z" />
        </svg>
        <p>Loading Chat Room…</p>
      </div>
    </div>

    <noscript>
      <p class="noscript">Chat Room needs JavaScript enabled to run.</p>
    </noscript>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
